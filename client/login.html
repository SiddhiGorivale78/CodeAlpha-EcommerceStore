<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | ShopEasy</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav id="nav"></nav>
<div class="container auth">
  <div class="box">
    <div class="tabs">
      <button class="btn" id="tl">Login</button>
      <button class="btn light" id="tr">Register</button>
    </div>
    <input id="name" placeholder="Full name" style="display:none">
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password (min 6 chars)">
    <div class="error" id="err"></div>
    <button class="btn" id="go" style="width:100%">Login</button>
  </div>
</div>
<script src="js/app.js"></script>
<script>
let mode = 'login';
function setMode(m) {
  mode = m;
  $('#name').style.display = m === 'register' ? 'block' : 'none';
  $('#go').textContent = m === 'register' ? 'Create Account' : 'Login';
  $('#tl').className = 'btn' + (m === 'login' ? '' : ' light');
  $('#tr').className = 'btn' + (m === 'register' ? '' : ' light');
  $('#err').textContent = '';
}
$('#tl').onclick = () => setMode('login');
$('#tr').onclick = () => setMode('register');
$('#go').onclick = async () => {
  try {
    const body = { email: $('#email').value, password: $('#password').value };
    if (mode === 'register') body.name = $('#name').value;
    const data = await api('/auth/' + mode, { method: 'POST', body });
    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));
    const next = new URLSearchParams(location.search).get('next');
    location.href = next === 'cart.html' ? 'cart.html' : 'index.html';
  } catch (e) { $('#err').textContent = e.message; }
};
</script>
</body></html>
